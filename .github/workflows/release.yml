name: CI Release

# Maven deploy on release tags. The steps live in the shared ci-templates-public repository.
on:
  push:
    tags:
      - "legacy-v[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  release:
    uses: unit-corp/ci-templates-public/.github/workflows/trigger-maven-central-release.yml@main
    with:
      tag_prefixes: "legacy-v v"
      snapshot_url: ${{ vars.MAVEN_SNAPSHOT_URL }}
